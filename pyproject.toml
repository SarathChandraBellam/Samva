[project]
name = "samva"
version = "0.1.0"
description = "Voice call agent powered by Gemini Live API with knowledge base (File Search RAG)"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1.0.0",
    "pyaudio>=0.2.14",
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
    # Twilio bridge
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "twilio>=9.0.0",
    "audioop-lts>=0.2.1; python_version >= '3.13'",
    "sounddevice>=0.5.5",
    "numpy>=2.4.4",
]

[project.scripts]
samva-setup-kb = "samva.cli.setup_kb:main"
samva-run = "samva.cli.run:main"
samva-serve = "samva.cli.serve:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/samva"]

[tool.uv]
dev-dependencies = []
